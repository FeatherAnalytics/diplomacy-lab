name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Pipeline tests
        run: uv run python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web tests
        run: npm test
